name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: jonasmaia-newtour
          filename: assets/github-stats.svg

          template: terminal

          base: header, activity, repositories

          config_timezone: Europe/Lisbon
          config_output: svg
