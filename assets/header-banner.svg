<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient Cyan-Indigo -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="30" cy="30" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Container Background -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="220" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="100" cy="40" r="90" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="180" r="110" fill="#818cf8" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Border Outline with Gradient Accent -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
  <path d="M 20 1 L 180 1" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 720 219 L 880 219" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Status Pill Badge -->
  <g transform="translate(450, 48)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="-85" cy="0" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-70" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">ENGINEERING &amp; AI</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Jonas Maia
  </text>

  <!-- Subtitle with Gradient -->
  <text x="450" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Software Engineer • Clean Architecture • Front-End &amp; AI Systems
  </text>

  <!-- Tech Dots / Minimalist Accent -->
  <g transform="translate(450, 185)">
    <circle cx="-30" cy="0" r="3" fill="#38bdf8" fill-opacity="0.7" />
    <circle cx="0" cy="0" r="3" fill="#818cf8" fill-opacity="0.7" />
    <circle cx="30" cy="0" r="3" fill="#c084fc" fill-opacity="0.7" />
  </g>
</svg>
